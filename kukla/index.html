<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hayat Ağacı · Kukla Denemesi</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0810;color:#e9dcc4;font-family:'EB Garamond',Georgia,serif;overflow:hidden}
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 340px}
#scene{position:relative;overflow:hidden;background:#120d18}
.bg{position:absolute;inset:-4% -8%;background:url(../a/s/bg_orman.webp) center 70%/cover;filter:brightness(.85);transition:transform .1s linear}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(8,4,14,.65) 100%)}
#hero{position:absolute;bottom:14%;height:60%;aspect-ratio:400/480;transform-origin:50% 100%}
#hero svg{width:100%;height:100%;overflow:visible}
#hero.flip svg{transform:scaleX(-1)}
.shadow{position:absolute;left:24%;right:24%;bottom:-1.5%;height:5%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%)}
#top{position:absolute;left:24px;top:18px}
#top h1{margin:0;font:700 26px 'Cinzel',serif;color:#efe0c4;text-shadow:0 2px 6px #000}
#top p{margin:4px 0 0;font-style:italic;color:#cbb8d8;text-shadow:0 2px 4px #000}
#acts{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;justify-content:center;width:max-content}
.btn{font:600 13px 'Cinzel',serif;color:#f1e2c6;background:linear-gradient(#3a2a22,#1e1511);border:1px solid #8a6a44;border-radius:4px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 #0c0806}
.btn:hover{border-color:#e0b878;color:#fff}.btn.on{border-color:#ffd24a;background:linear-gradient(#6a4a22,#3a2511)}
#panel{background:linear-gradient(#1d151a,#110c10);border-left:1px solid #5a4330;padding:18px 18px 30px;overflow:auto}
#panel h2{font:700 15px 'Cinzel',serif;letter-spacing:.15em;text-transform:uppercase;color:#c9a874;margin:18px 0 8px;border-bottom:1px solid #3d2e1a;padding-bottom:4px}
#panel h2:first-child{margin-top:0}
.row{margin:8px 0}.row label{display:block;font-size:14px;color:#cdb991;margin-bottom:4px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{font:13px 'EB Garamond',serif;color:#e9dcc4;background:#241a16;border:1px solid #5a4330;border-radius:3px;padding:4px 8px;cursor:pointer}
.opt.sel{border-color:#ffd24a;background:#4a3418;color:#fff}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #5a4330;cursor:pointer;padding:0}
.sw.sel{border-color:#ffd24a;box-shadow:0 0 6px #ffd24a}
.note{font-size:13px;color:#a99a80;line-height:1.4;margin-top:14px}
.num{position:absolute;font:700 34px 'Cinzel';color:#ffd9a0;text-shadow:0 3px 0 #2a0c0c,0 0 8px #000;animation:num 1s ease-out forwards;pointer-events:none}
@keyframes num{0%{transform:translateY(10px);opacity:0}15%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:58vh 1fr}#panel{border-left:0;border-top:1px solid #5a4330}}
</style>
</head>
<body>
<div id="app">
 <div id="scene"><div class="bg" id="bg"></div>
  <div id="hero"><div class="shadow"></div><svg id="svg" viewBox="0 0 400 480"></svg></div>
  <div class="vig"></div>
  <div id="top"><h1>Kukla Denemesi</h1><p>← → ile yürü · Shift ile koş · aşağıdaki düğmelerle hareket</p></div>
  <div id="acts">
   <button class="btn" data-a="slash">Savur</button><button class="btn" data-a="stab">Dürt</button><button class="btn" data-a="cast">Büyü</button>
   <button class="btn" data-a="block">Kalkan</button><button class="btn" data-a="hit">Yara al</button><button class="btn" data-a="die">Öl / Kalk</button><button class="btn" data-a="win">Zafer</button>
  </div>
 </div>
 <div id="panel"></div>
</div>
<script>
/* ============ KUKLA: parçalı karakter (yan görünüm, sağa bakar) ============
   Pivotlar: kalça H(200,270) · omuz S(200,160) · dirsek (200,235) · bilek (200,305)
   diz (200,365) · ayak bileği (200,455) · boyun (206,140)
   Açı: pozitif = uzuv geriye (sola) döner, negatif = öne. */
const OUT='#1a0f12';
const OPT={
 ten:{ad:'Ten',sw:{acik:'#e9c4a2',bugday:'#c99a74',esmer:'#9a6a48',koyu:'#5e3b28'}},
 sacRenk:{ad:'Saç rengi',sw:{siyah:'#1f1612',kahve:'#4a2c1a',kizil:'#8a3a1c',sari:'#b8945a',kir:'#9c958c'}},
 sac:{ad:'Saç',o:{kisa:'Kısa',uzun:'Uzun',atkuyrugu:'At kuyruğu',kazinmis:'Kazınmış'}},
 sakal:{ad:'Sakal',o:{yok:'Yok',kirli:'Kirli sakal',kisa:'Kısa',uzun:'Uzun örgülü'}},
 kask:{ad:'Kask',o:{yok:'Yok',deri:'Deri başlık',demir:'Demir miğfer'},eq:1},
 govde:{ad:'Gövde',o:{gomlek:'Keten gömlek',deri:'Deri zırh',zincir:'Zincir zırh'},eq:1},
 pelerin:{ad:'Pelerin',o:{yok:'Yok',koyu:'Yırtık koyu pelerin',kizil:'Kızıl pelerin'},eq:1},
 silah:{ad:'Silah',o:{yok:'Yok',kilic:'Kılıç',balta:'Balta',asa:'Asa',hancer:'Hançer'},eq:1},
 kalkan:{ad:'Kalkan',o:{yok:'Yok',tahta:'Tahta kalkan',demir:'Demir kalkan'},eq:1}};
const C={ten:'bugday',sacRenk:'kahve',sac:'kisa',sakal:'kisa',kask:'yok',govde:'zincir',pelerin:'koyu',silah:'kilic',kalkan:'tahta'};

function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));return '#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1)}
const P=(d,fill,ex='')=>`<path d="${d}" fill="${fill}" stroke="${OUT}" stroke-width="3" stroke-linejoin="round" ${ex}/>`;
const PN=(d,fill,ex='')=>`<path d="${d}" fill="${fill}" ${ex}/>`;

/* ---------- parça çizimleri ---------- */
function torso(){const t=OPT.ten.sw[C.ten],g=C.govde;
 let s='';
 const body='M174,160 Q198,138 230,152 Q238,190 232,222 Q228,252 222,280 L180,280 Q170,240 172,200 Z';
 if(g==='gomlek'){s+=P(body,'url(#gCloth)')+PN('M200,150 L214,182 L206,184 Z',shade('#6b5a44',-.35))+PN('M176,200 Q190,206 182,262',`none`,`stroke="${shade('#6b5a44',-.3)}" stroke-width="3"`)}
 if(g==='deri'){s+=P(body,'url(#gLeather)')+PN('M178,176 L232,166 L233,176 L179,188 Z','#3a2414')+PN('M176,214 L231,208 L230,218 L176,224 Z','#3a2414')+`<circle cx="214" cy="172" r="3" fill="#b89a62"/>`+PN('M182,236 Q200,232 226,236',`none`,`stroke="#2a1a10" stroke-width="2"`)}
 if(g==='zincir'){s+=P(body,'url(#pMail)')+PN(body,'url(#gShadeR)')+P('M190,214 L226,210 Q228,250 222,280 L186,280 Q184,246 190,214 Z','url(#gTabard)')+PN('M204,226 l6,10 l-6,10 l-6,-10 Z','#c9a874')}
 // kemer
 s+=P('M178,258 L226,254 L227,270 L178,274 Z','#3a2414')+P('M198,256 L210,255 L210,270 L198,271 Z','#b89a62');
 return s}
function neck(){return P('M198,126 L216,124 L218,156 L200,158 Z',`url(#gSkin)`)}
function head(){const t=OPT.ten.sw[C.ten],hc=OPT.sacRenk.sw[C.sacRenk];let s='';
 // arka saç
 if(C.sac==='uzun'&&C.kask!=='demir')s+=P('M176,90 Q170,130 186,160 L200,150 Q190,120 196,96 Z',hc);
 if(C.sac==='atkuyrugu'&&C.kask!=='demir')s+=P('M180,92 Q160,110 166,150 Q176,140 184,112 Z',hc);
 // kafa
 s+=P('M184,96 Q184,62 214,62 Q240,64 240,92 L244,104 Q246,108 240,110 L240,118 Q238,132 222,136 L204,134 Q188,128 186,112 Z','url(#gSkin)');
 s+=PN('M236,96 L243,104 L238,106 Z',shade(t,-.25));// burun gölgesi
 s+=`<ellipse cx="196" cy="104" rx="7" ry="9" fill="${shade(t,-.12)}" stroke="${OUT}" stroke-width="2.5"/>`;// kulak
 s+=PN('M224,93 L234,92','none',`stroke="${OUT}" stroke-width="3" stroke-linecap="round"`)+`<circle cx="229" cy="97" r="2.4" fill="${OUT}"/>`;// kaş+göz
 s+=PN('M226,122 L235,121','none',`stroke="${shade(t,-.45)}" stroke-width="2.5" stroke-linecap="round"`);// ağız
 // sakal
 const bd=shade(hc,-.05);
 if(C.sakal==='kirli')s+=PN('M206,112 Q210,132 226,134 Q238,130 240,114 L236,126 Q226,138 208,128 Z',bd,'opacity=".45"');
 if(C.sakal==='kisa')s+=P('M204,110 Q206,140 224,142 Q240,140 241,116 L238,118 Q234,124 224,124 Q214,122 210,112 Z',bd);
 if(C.sakal==='uzun')s+=P('M204,110 Q204,150 214,170 L222,184 L228,168 Q242,146 241,116 L238,118 Q232,126 222,124 Q212,122 210,112 Z',bd)+PN('M214,150 L226,150 M215,162 L225,162','none',`stroke="${shade(hc,-.4)}" stroke-width="2"`);
 if(C.sakal!=='yok'&&C.sakal!=='kirli')s+=P('M222,116 Q232,112 240,117 Q232,119 224,120 Z',bd);// bıyık
 // ön saç
 if(C.kask==='yok'){
  if(C.sac==='kisa')s+=P('M182,100 Q178,60 214,58 Q240,58 242,84 Q230,74 214,78 Q200,80 196,98 Z',hc);
  if(C.sac==='uzun')s+=P('M180,108 Q174,58 214,56 Q242,56 243,86 Q228,72 212,78 Q198,84 196,108 Z',hc);
  if(C.sac==='atkuyrugu')s+=P('M184,98 Q180,60 214,58 Q240,58 241,82 Q226,72 210,76 Q198,80 194,96 Z',hc)+P('M178,94 l8,-4 l2,10 l-8,4 Z','#3a2414');
  if(C.sac==='kazinmis')s+=PN('M186,94 Q186,64 214,63 Q236,64 239,84 Q224,76 210,78 Q196,82 190,96 Z',hc,'opacity=".35"');}
 if(C.kask==='deri'){s+=P('M180,104 Q176,56 214,54 Q244,56 244,86 L236,88 Q226,72 210,76 Q196,82 196,108 Z','url(#gLeather)')+PN('M184,92 Q212,80 242,84','none','stroke="#2a1a10" stroke-width="2.5"');
  if(C.sac==='uzun')s+=P('M182,104 Q178,130 188,150 L198,146 Q192,126 196,106 Z',hc)}
 if(C.kask==='demir'){s+=P('M178,108 Q172,50 214,48 Q248,50 246,90 L238,92 L236,86 Q226,78 212,80 Q198,84 196,112 Z','url(#gIron)')+P('M234,84 L242,86 L242,114 L236,114 Z','url(#gIron)')+P('M180,94 Q212,80 246,88 L246,96 Q212,88 180,102 Z',shade('#8a8a92',-.3))+[190,204,218,232].map(x=>`<circle cx="${x}" cy="${94-(x-180)*.06}" r="2" fill="#d8d8de"/>`).join('')}
 return s}
function upperArm(front){const t=OPT.ten.sw[C.ten],g=C.govde;let s=P('M190,150 Q200,142 212,150 L210,236 L192,236 Z',g==='gomlek'?'url(#gCloth)':'url(#gSkin)');
 if(g==='zincir')s+=P('M189,150 Q200,140 213,150 L211,206 L190,206 Z','url(#pMail)');
 if(g==='deri')s+=P('M188,148 Q200,138 214,148 L214,178 Q200,184 188,178 Z','url(#gLeather)');
 if(!front)s+=PN('M190,150 Q200,142 212,150 L210,236 L192,236 Z','#000','opacity=".22"');
 return s}
function foreArm(front){const g=C.govde;let s=P('M192,232 L210,232 L207,306 L194,306 Z',g==='gomlek'?'url(#gCloth)':'url(#gSkin)');
 s+=P('M191,262 L211,262 L208,302 L193,302 Z',g==='zincir'?'url(#gIron)':'url(#gLeather)');
 s+=P('M200,302 m-12,8 a12,12 0 1,0 24,0 a12,12 0 1,0 -24,0','url(#gSkin)');
 if(!front)s+=PN('M192,232 L210,232 L207,306 L194,306 Z','#000','opacity=".22"');
 return s}
function thigh(front){let s=P('M182,264 L218,264 L213,368 L189,368 Z','url(#gPants)');
 if(C.govde==='zincir')s+=P('M181,264 L219,264 L216,300 L184,302 Z','url(#pMail)');
 if(C.govde==='deri')s+=P('M181,264 L219,264 L217,292 L183,294 Z','url(#gLeather)');
 if(!front)s+=PN('M182,264 L218,264 L213,368 L189,368 Z','#000','opacity=".28"');return s}
function shin(front){let s=P('M189,362 L212,362 L209,450 L192,450 Z','url(#gPants)')+P('M186,392 L214,392 L212,458 L188,458 Z','url(#gBoot)')+PN('M186,398 L214,398','none','stroke="#2a1a10" stroke-width="3"');
 if(!front)s+=PN('M186,362 L214,362 L212,458 L188,458 Z','#000','opacity=".28"');return s}
function foot(front){let s=P('M186,448 L212,446 Q226,452 236,462 L236,472 L186,472 Z','url(#gBoot)')+PN('M186,468 L236,468','none','stroke="#1a100a" stroke-width="4"');
 if(!front)s+=PN('M186,448 L212,446 Q226,452 236,462 L236,472 L186,472 Z','#000','opacity=".28"');return s}
function cloak(){if(C.pelerin==='yok')return '';const c=C.pelerin==='koyu'?'#3a2a30':'#6a1f22';
 return P('M180,146 Q200,140 214,150 Q200,240 196,330 L186,352 L174,336 L162,360 L150,338 L138,350 Q140,250 180,146 Z',`url(#gCloak)`)+PN('M170,180 Q160,250 156,330','none',`stroke="${shade(c,-.4)}" stroke-width="3"`)}
function cloakCollar(){if(C.pelerin==='yok')return '';return P('M178,146 Q200,132 224,148 Q212,160 198,158 Q186,156 178,146 Z','url(#gCloak)')+`<circle cx="214" cy="152" r="5" fill="#b89a62" stroke="${OUT}" stroke-width="2"/>`}
function weapon(){const w=C.silah;// el (200,312) merkezli; varsayılan uç yukarı
 if(w==='kilic')return P('M196,330 L204,330 L204,346 L196,346 Z','#3a2414')+`<circle cx="200" cy="350" r="5" fill="#b89a62" stroke="${OUT}" stroke-width="2"/>`+P('M184,318 L216,318 L216,326 L184,326 Z','#b89a62')+P('M195,318 L205,318 L204,170 L200,158 L196,170 Z','url(#gBlade)')+PN('M200,170 L200,314','none','stroke="#6c6c74" stroke-width="1.5"');
 if(w==='balta')return P('M196,340 L204,340 L204,190 L196,190 Z','url(#gWood)')+P('M204,196 Q236,188 246,206 Q240,226 246,244 Q232,250 204,238 Z','url(#gBlade)')+P('M196,204 L188,210 L188,228 L196,232 Z','url(#gIron)');
 if(w==='asa')return P('M196,370 L204,370 L205,170 L195,170 Z','url(#gWood)')+P('M192,172 Q200,140 210,170 Q204,160 200,166 Q196,160 192,172 Z','url(#gWood)')+`<circle class="glow" cx="200" cy="152" r="10" fill="#7fb8ff" stroke="#cfe6ff" stroke-width="2"/><circle cx="200" cy="152" r="22" fill="url(#gGlow)"/>`;
 if(w==='hancer')return P('M197,328 L203,328 L203,342 L197,342 Z','#3a2414')+P('M190,320 L210,320 L210,326 L190,326 Z','#b89a62')+P('M196,320 L204,320 L202,256 L200,248 L198,256 Z','url(#gBlade)');
 return ''}
function shield(){if(C.kalkan==='yok')return '';
 const f=C.kalkan==='tahta'?'url(#gWood)':'url(#gIron)';
 return `<ellipse cx="214" cy="300" rx="30" ry="62" fill="${f}" stroke="${OUT}" stroke-width="3.5"/><ellipse cx="214" cy="300" rx="26" ry="57" fill="none" stroke="${C.kalkan==='tahta'?'#6b6b72':'#c9c9d0'}" stroke-width="3"/><ellipse cx="216" cy="300" rx="9" ry="14" fill="url(#gIron)" stroke="${OUT}" stroke-width="2.5"/>`+(C.kalkan==='tahta'?PN('M214,246 L214,354 M200,252 L200,350 M228,252 L228,350','none','stroke="#3a2414" stroke-width="2" opacity=".6"'):'')}

const DEFS=()=>{const t=OPT.ten.sw[C.ten],cc=C.pelerin==='kizil'?'#6a1f22':'#3a2a30';const g=(id,a,b,x2=1,y2=1)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
 return `<defs>${g('gSkin',shade(t,.12),shade(t,-.18))}${g('gCloth',shade('#6b5a44',.1),shade('#6b5a44',-.3))}${g('gLeather','#7a5232','#3e2716')}${g('gPants','#4f4434','#2e271d')}${g('gBoot','#5a3a22','#2a1a10')}
 ${g('gIron','#b9b9c2','#55555e')}${g('gBlade','#e6e6ec','#7c7c86',1,0)}${g('gWood','#8a5a32','#4a2e18')}${g('gTabard','#7a2a28','#3e1414')}${g('gCloak',shade(cc,.12),shade(cc,-.35))}${g('gShadeR','rgba(0,0,0,0)','rgba(0,0,0,.35)',1,0)}
 <radialGradient id="gGlow"><stop offset="0" stop-color="#9fd0ff" stop-opacity=".9"/><stop offset="1" stop-color="#4a7aff" stop-opacity="0"/></radialGradient>
 <pattern id="pMail" width="7" height="6" patternUnits="userSpaceOnUse"><rect width="7" height="6" fill="#6d6d76"/><circle cx="3.5" cy="3" r="2.4" fill="none" stroke="#a8a8b2" stroke-width="1.3"/><circle cx="0" cy="0" r="2.4" fill="none" stroke="#8a8a94" stroke-width="1.1"/><circle cx="7" cy="0" r="2.4" fill="none" stroke="#8a8a94" stroke-width="1.1"/></pattern></defs>`};

/* Kemik düzeni: her <g data-r="..."> açısı her karede güncellenir */
const R=(r,px,py,inner)=>`<g data-r="${r}" data-p="${px},${py}">${inner}</g>`;
function build(){
 const armB=(inner)=>R('torso',200,270,R('cloak0',0,0,'')+R('uB',200,160,R('fB',201,235,inner)));
 const armF=(inner)=>R('torso',200,270,R('uF',200,160,R('fF',201,235,inner)));
 const s=DEFS()+`<g id="root">`+
  R('torso',200,270,R('cloak',205,150,cloak()))+
  armB(foreArm(false))+R('torso',200,270,R('uB',200,160,upperArm(false)))+
  R('tB',200,270,thigh(false)+R('kB',200,365,shin(false)+R('aB',200,455,foot(false))))+
  R('torso',200,270,torso())+
  armB(R('sh',200,312,shield()))+
  R('tF',200,270,thigh(true)+R('kF',200,365,shin(true)+R('aF',200,455,foot(true))))+
  R('torso',200,270,neck()+R('head',207,138,head())+cloakCollar())+
  armF(R('wp',200,312,weapon()))+
  R('torso',200,270,R('uF',200,160,upperArm(true)+R('fF',201,235,foreArm(true))))+
  `</g>`;
 document.getElementById('svg').innerHTML=s;
 NODES=[...document.querySelectorAll('[data-r]')].map(el=>{const [x,y]=el.dataset.p.split(',').map(Number);return {el,r:el.dataset.r,x,y}});
 ROOT=document.getElementById('root')}
let NODES=[],ROOT=null;

/* ---------- pozlar ---------- */
const BASE={torso:0,head:0,uF:-8,fF:-28,wp:105,uB:10,fB:-40,sh:0,tF:-4,kF:4,aF:0,tB:6,kB:4,aB:-6,cloak:0,cloak0:0,y:0,rot:0,x:0};
function lerp(a,b,k){return a+(b-a)*k}
function mix(A,B,k){const o={};for(const n in BASE)o[n]=lerp(A[n]??BASE[n],B[n]??BASE[n],k);return o}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
// tek seferlik hareketler: [süre ms, anahtar kareler [zaman 0..1, poz]]
const ACT={
 slash:[620,[[0,{}],[.35,{uF:175,fF:-60,wp:40,torso:6,head:-3,uB:-20,tF:-14,kF:16,tB:16}],[.55,{uF:-70,fF:-10,wp:120,torso:-12,head:4,uB:30,tF:-22,kF:14,tB:20,x:16}],[.75,{uF:-60,fF:-12,wp:125,torso:-10,x:14}],[1,{}]]],
 stab:[480,[[0,{}],[.35,{uF:25,fF:-100,wp:95,torso:5}],[.6,{uF:-80,fF:-5,wp:92,torso:-14,tF:-24,kF:18,tB:18,x:26}],[1,{}]]],
 cast:[1100,[[0,{}],[.3,{uF:-120,fF:-30,wp:20,uB:-40,fB:-70,torso:-4,head:-6}],[.7,{uF:-125,fF:-25,wp:15,uB:-45,fB:-75,torso:-6,head:-8,y:-6}],[1,{}]],'cast'],
 block:[700,[[0,{}],[.3,{uB:-70,fB:-60,sh:-10,torso:4,uF:10,tF:-10,tB:14,kB:12}],[.8,{uB:-72,fB:-62,sh:-10,torso:4,uF:10,tF:-10,tB:14,kB:12}],[1,{}]]],
 hit:[450,[[0,{}],[.25,{torso:14,head:12,uF:30,uB:30,x:-14,tF:8,tB:-4,kF:14,kB:10}],[1,{}]],'hit'],
 win:[1200,[[0,{}],[.35,{uF:-170,fF:-10,wp:10,head:-10,torso:-4,y:-8}],[.8,{uF:-172,fF:-8,wp:8,head:-10,torso:-4,y:-8}],[1,{}]]]};
let act=null,dead=false,deadK=0;
const keys={};let X=.3,vx=0,face=1,walkPh=0,t0=performance.now();

function pose(t){let p={...BASE};
 const moving=Math.abs(vx)>.0001,run=moving&&keys.Shift;
 // nefes
 const br=Math.sin(t/650);p.torso+=br*.8;p.head+=Math.sin(t/900)*1.2;p.uF+=br*1.5;p.uB+=br*1.2;p.cloak+=Math.sin(t/800)*2;p.y+=br*.8;
 if(moving){const f=run?.016:.0105;walkPh+=f*16;const ph=walkPh,sn=Math.sin(ph),cs=Math.cos(ph),A=run?38:26;
  p.tF=-A*sn;p.tB=A*sn;p.kF=6+(run?55:36)*Math.max(0,Math.cos(ph-.3));p.kB=6+(run?55:36)*Math.max(0,-Math.cos(ph-.3));
  p.aF=-(p.tF+p.kF)*.7;p.aB=-(p.tB+p.kB)*.7;
  p.uF=-8+(run?32:20)*sn;p.uB=10-(run?32:20)*sn;p.fF=-28-(run?40:12);p.fB=-40-(run?30:8);
  p.torso=run?-10:-3;p.y=-(run?7:4)*Math.abs(Math.cos(ph));p.cloak=(run?22:10)+Math.sin(ph*2)*4;p.head=run?4:0}
 if(act){const k=(t-act.t)/act.d;if(k>=1){act=null}else{const F=act.kf;let i=0;while(i<F.length-2&&k>F[i+1][0])i++;
   const [a,A]=F[i],[b,Bp]=F[i+1],kk=ease((k-a)/(b-a));const m=mix({...BASE,...A},{...BASE,...Bp},kk);
   for(const n in m){if(n in p&&!(moving&&/^[tka][FB]$/.test(n)))p[n]+=m[n]-BASE[n]}}}
 if(dead||deadK>0){const k=deadK;p.rot=-82*k;p.y+=0;p.tF+=-30*k;p.kF+=40*k;p.tB+=20*k;p.kB+=50*k;p.uF+=-60*k;p.uB+=-40*k;p.head+=-20*k;p.torso+=-6*k}
 return p}

function frame(now){
 const dt=Math.min(40,now-(frame.l||now));frame.l=now;
 const dir=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
 if(!dead&&!act){vx=dir*(keys.Shift?.00042:.00024)}else vx=0;
 if(dir&&!dead)face=dir;X=Math.max(.05,Math.min(.82,X+vx*dt));
 deadK+=((dead?1:0)-deadK)*Math.min(1,dt/180);
 const p=pose(now);
 for(const n of NODES){const a=p[n.r]||0;n.el.setAttribute('transform',a?`rotate(${a.toFixed(2)} ${n.x} ${n.y})`:'')}
 const hx=(p.x||0)*face;
 ROOT.setAttribute('transform',`translate(${hx.toFixed(1)} ${(p.y||0).toFixed(1)}) translate(200 0) scale(1.28 1) translate(-200 0) rotate(${p.rot.toFixed(1)} 200 470)`+(deadK>0?` translate(0 ${(deadK*-10).toFixed(1)})`:''));
 const H=document.getElementById('hero');H.style.left=`calc(${(X*100).toFixed(2)}% )`;H.classList.toggle('flip',face<0);
 document.getElementById('bg').style.transform=`translateX(${(-(X-.4)*40).toFixed(1)}px)`;
 const g=document.querySelector('.glow');if(g)g.setAttribute('r',(10+(act&&act.fx==='cast'?6+3*Math.sin(now/60):1.5*Math.sin(now/300))).toFixed(1));
 document.getElementById('svg').style.filter=act&&act.fx==='hit'&&(now-act.t)<160?'brightness(2.2) sepia(.4) hue-rotate(-30deg)':'';
 requestAnimationFrame(frame)}

function play(a){if(a==='die'){dead=!dead;return}if(dead)return;const [d,kf,fx]=ACT[a];act={t:performance.now(),d,kf,fx};
 if(a==='hit'){const n=document.createElement('div');n.className='num';n.textContent=7+Math.floor(Math.random()*8);const h=document.getElementById('hero');n.style.left='50%';n.style.top='5%';h.appendChild(n);setTimeout(()=>n.remove(),1000)}}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>play(b.dataset.a));
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='1')play('slash');if(e.key==='2')play('stab');if(e.key==='3')play('cast')});
addEventListener('keyup',e=>{keys[e.key]=false});

function panel(){let h='<h2>Görünüş</h2>';
 for(const [k,o] of Object.entries(OPT)){if(o.eq&&!h.includes('Ekipman'))h+='<h2>Ekipman</h2>';
  h+=`<div class="row"><label>${o.ad}</label><div class="opts">`;
  if(o.sw)h+=Object.entries(o.sw).map(([v,c])=>`<button class="sw ${C[k]===v?'sel':''}" style="background:${c}" data-k="${k}" data-v="${v}" title="${v}"></button>`).join('');
  else h+=Object.entries(o.o).map(([v,a])=>`<button class="opt ${C[k]===v?'sel':''}" data-k="${k}" data-v="${v}">${a}</button>`).join('');
  h+='</div></div>'}
 h+='<p class="note">Bu bir hareket ve giydirme denemesi. Parçaların çizimi geçici; onay gelirse her parça ChatGPT\'de oyunun tarzında, sabit bir şablonla çizilecek ve kod aynen çalışacak.</p>';
 const pn=document.getElementById('panel');pn.innerHTML=h;
 pn.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{C[b.dataset.k]=b.dataset.v;build();panel()})}
build();panel();requestAnimationFrame(frame);
</script>
